<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>教員向け指導計画作成アプリ</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="container">
  <header>
    <h1>📚 教員向け指導計画作成アプリ</h1>
    <p class="subtitle">AIが正式な指導案フォーマットで作成します</p>
  </header>

  <main>
    <div class="tabs">
      <button class="tab-button active" onclick="switchTab('unit')">本時の指導案</button>
      <button class="tab-button" onclick="switchTab('monthly')">月間指導計画</button>
      <button class="tab-button" onclick="switchTab('history')">保存した計画</button>
    </div>

    <!-- 本時の指導案フォーム -->
    <div id="unit-form" class="form-container">
      <h2>本時の指導案を作成</h2>
      <form id="planForm">
        <div class="form-row">
          <div class="form-group">
            <label>学校種別</label>
            <select id="school-level">
              <option value="elementary">小学校</option>
              <option value="junior_high">中学校</option>
            </select>
          </div>
          <div class="form-group">
            <label>学年 <span class="required">*</span></label>
            <select id="grade" required>
              <option value="">選択してください</option>
              <option value="第1学年">第1学年</option>
              <option value="第2学年">第2学年</option>
              <option value="第3学年">第3学年</option>
              <option value="第4学年">第4学年</option>
              <option value="第5学年">第5学年</option>
              <option value="第6学年">第6学年</option>
            </select>
          </div>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label>教科 <span class="required">*</span></label>
            <input type="text" id="subject" placeholder="例: 算数、国語、技術・家庭" required>
          </div>
          <div class="form-group">
            <label>単元名 <span class="required">*</span></label>
            <input type="text" id="unit" placeholder="例: 私たちの住まい" required>
          </div>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label>総授業時数 <span class="required">*</span></label>
            <input type="number" id="hours" placeholder="例: 6" min="1" max="50" required>
          </div>
          <div class="form-group">
            <label>本時（何時間目）</label>
            <input type="number" id="current-hour" placeholder="例: 1" min="1" max="50">
          </div>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label>学校名</label>
            <input type="text" id="school" placeholder="例: 〇〇小学校">
          </div>
          <div class="form-group">
            <label>指導者名</label>
            <input type="text" id="teacher" placeholder="例: 山田 太郎">
          </div>
        </div>
        <div class="form-group">
          <label>日時</label>
          <input type="text" id="date" placeholder="例: 令和7年9月11日（月）4校時">
        </div>
        <div class="save-option">
          <label><input type="checkbox" id="save-unit-plan"> 生成後に自動保存する</label>
        </div>
        <button type="submit" class="generate-button">
          <span class="button-text">✨ 指導案を生成</span>
          <span class="loading-text" style="display:none">AIが生成中です...</span>
        </button>
      </form>
    </div>

    <!-- 月間指導計画フォーム -->
    <div id="monthly-form" class="form-container" style="display:none">
      <h2>月間指導計画を作成</h2>
      <form id="monthlyPlanForm">
        <div class="form-row">
          <div class="form-group">
            <label>学校種別</label>
            <select id="monthly-school-level">
              <option value="elementary">小学校</option>
              <option value="junior_high">中学校</option>
            </select>
          </div>
          <div class="form-group">
            <label>学年 <span class="required">*</span></label>
            <select id="monthly-grade" required>
              <option value="">選択してください</option>
              <option value="第1学年">第1学年</option>
              <option value="第2学年">第2学年</option>
              <option value="第3学年">第3学年</option>
              <option value="第4学年">第4学年</option>
              <option value="第5学年">第5学年</option>
              <option value="第6学年">第6学年</option>
            </select>
          </div>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label>教科 <span class="required">*</span></label>
            <input type="text" id="monthly-subject" placeholder="例: 算数" required>
          </div>
          <div class="form-group">
            <label>月 <span class="required">*</span></label>
            <select id="month" required>
              <option value="">選択してください</option>
              <option value="4月">4月</option>
              <option value="5月">5月</option>
              <option value="6月">6月</option>
              <option value="7月">7月</option>
              <option value="9月">9月</option>
              <option value="10月">10月</option>
              <option value="11月">11月</option>
              <option value="12月">12月</option>
              <option value="1月">1月</option>
              <option value="2月">2月</option>
              <option value="3月">3月</option>
            </select>
          </div>
        </div>
        <!-- 週ごとの単元入力 -->
        <div class="form-group">
          <label>週ごとの単元を入力
            <span style="font-weight:normal;font-size:0.85em;color:#888">（空欄の場合はAIが自動で決定します）</span>
          </label>
          <div class="weekly-units-container">
            <div class="weekly-unit-row">
              <span class="week-label">第1週</span>
              <input type="text" id="week1-unit" placeholder="例: 大きな数（省略可）">
              <input type="number" id="week1-hours" placeholder="時数" min="1" max="10" style="width:80px">
            </div>
            <div class="weekly-unit-row">
              <span class="week-label">第2週</span>
              <input type="text" id="week2-unit" placeholder="例: わり算（省略可）">
              <input type="number" id="week2-hours" placeholder="時数" min="1" max="10" style="width:80px">
            </div>
            <div class="weekly-unit-row">
              <span class="week-label">第3週</span>
              <input type="text" id="week3-unit" placeholder="例: 時こくと時間（省略可）">
              <input type="number" id="week3-hours" placeholder="時数" min="1" max="10" style="width:80px">
            </div>
            <div class="weekly-unit-row">
              <span class="week-label">第4週</span>
              <input type="text" id="week4-unit" placeholder="例: まとめ・テスト（省略可）">
              <input type="number" id="week4-hours" placeholder="時数" min="1" max="10" style="width:80px">
            </div>
          </div>
          <p class="hint-text">💡 入力した単元をもとにAIが指導内容・留意点を自動作成します</p>
        </div>

        <div class="save-option">
          <label><input type="checkbox" id="save-monthly-plan"> 生成後に自動保存する</label>
        </div>
        <button type="submit" class="generate-button">
          <span class="button-text">✨ 月間計画を生成</span>
          <span class="loading-text" style="display:none">AIが生成中です...</span>
        </button>
      </form>
    </div>

    <!-- 保存した計画タブ -->
    <div id="history-view" class="form-container" style="display:none">
      <h2>保存した計画</h2>
      <div class="search-filters">
        <select id="filter-grade" onchange="loadPlans()">
          <option value="">すべての学年</option>
          <option value="第1学年">第1学年</option>
          <option value="第2学年">第2学年</option>
          <option value="第3学年">第3学年</option>
          <option value="第4学年">第4学年</option>
          <option value="第5学年">第5学年</option>
          <option value="第6学年">第6学年</option>
        </select>
        <select id="filter-type" onchange="loadPlans()">
          <option value="">すべての種類</option>
          <option value="unit">本時指導案</option>
          <option value="monthly">月間計画</option>
        </select>
        <button onclick="loadPlans()" class="action-button">🔄 更新</button>
      </div>
      <div id="plans-list" style="margin-top:20px">
        <p style="text-align:center;color:#999">読み込み中...</p>
      </div>
    </div>

    <!-- 生成結果表示エリア -->
    <div id="result-container" style="display:none">
      <div class="result-header">
        <h2>生成された指導案</h2>
        <div class="result-actions">
          <button onclick="downloadDocx()" class="action-button primary-btn">📄 Wordで保存</button>
          <button onclick="window.print()" class="action-button">🖨️ 印刷</button>
          <button onclick="clearResult()" class="action-button">✕ 閉じる</button>
        </div>
      </div>
      <div id="plan-preview" class="plan-preview"></div>
    </div>
  </main>

  <footer>
    <p>© 2025 教員向け指導計画作成アプリ | Powered by Gemini AI</p>
  </footer>
</div>
<script src="script.js"></script>
</body>
</html>
